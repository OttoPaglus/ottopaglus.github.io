<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>2026年10–12月 重要天文现象日历 · AiStar天文社</title>
<style>
:root{
  --panel:#ffffff;
  --line:rgba(22,38,64,.11);
  --line2:rgba(22,38,64,.06);
  --tx:#0f1c31; --tx2:#4a5c78; --tx3:#8391a8;
  --chong:#bf7318; --he:#1475b8; --liu:#cc3573; --yue:#967400; --ju:#0d8a56;
  --sh:0 1px 2px rgba(23,43,77,.05),0 10px 26px rgba(23,43,77,.055);
  --shs:0 1px 2px rgba(23,43,77,.05);
  --pg:#eef2f9;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Noto Sans SC",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:linear-gradient(180deg,#f8fafd 0%,#eff3fa 38%,#e9eff8 100%);
  background-attachment:fixed;
  color:var(--tx);line-height:1.6;font-size:15px;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;padding-bottom:90px;
}
body.lock{overflow:hidden}
#stars{position:fixed;inset:0;pointer-events:none;z-index:0}
#stars i{position:absolute;background:#8ba4c9;border-radius:50%;opacity:.22;animation:tw 5s infinite ease-in-out}
@keyframes tw{0%,100%{opacity:.12}50%{opacity:.4}}
.wrap{max-width:1240px;margin:0 auto;padding:0 24px;position:relative;z-index:1}

/* ---------- HERO ---------- */
.hero{position:relative;padding:68px 0 26px;overflow:hidden}
.hero::after{content:'';position:absolute;left:50%;top:-300px;width:1200px;height:820px;transform:translateX(-50%);
  background:radial-gradient(circle at center,rgba(112,152,255,.30),rgba(150,120,255,.13) 45%,transparent 72%);
  filter:blur(14px);pointer-events:none;z-index:0}
.hero .wrap{position:relative;z-index:1}
.brand{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--tx2);
  border:1px solid var(--line);border-radius:999px;padding:6px 14px;background:#fff;box-shadow:var(--shs);letter-spacing:.05em}
.brand .dot{width:6px;height:6px;border-radius:50%;background:#4a7ae0;box-shadow:0 0 8px rgba(74,122,224,.75)}
h1{font-size:clamp(32px,5.2vw,56px);font-weight:800;letter-spacing:-.015em;line-height:1.12;margin-top:20px;
  background:linear-gradient(175deg,#101d33 30%,#3d63b5 118%);-webkit-background-clip:text;background-clip:text;
  color:transparent;-webkit-text-fill-color:transparent}
.sub{margin-top:12px;color:var(--tx2);font-size:14.5px}
.sub b{color:#2b4267;font-weight:600}
.stats{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px}
.st{flex:1 1 148px;min-width:138px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px 18px;box-shadow:var(--sh)}
.st b{display:block;font-size:28px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.st span{display:block;margin-top:3px;font-size:12px;color:var(--tx3);letter-spacing:.06em}
.next{margin-top:22px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  background:linear-gradient(90deg,rgba(74,122,224,.12),rgba(74,122,224,.02));
  border:1px solid rgba(74,122,224,.26);border-radius:14px;padding:13px 20px;font-size:14px}
.next .k{color:#3560ba;font-size:12px;letter-spacing:.1em}
.next b{font-size:15.5px}
.next .d{color:var(--tx3);font-size:13px}

/* ---------- TOOLBAR ---------- */
.toolbar{position:sticky;top:0;z-index:40;padding:13px 0;margin-top:16px;
  background:rgba(248,250,253,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line)}
.tb-in{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;padding:6px 13px;border-radius:999px;
  border:1px solid var(--line);background:#fff;color:var(--tx2);cursor:pointer;
  box-shadow:var(--shs);user-select:none;transition:.18s;white-space:nowrap}
.chip i{width:8px;height:8px;border-radius:50%;display:block;background:var(--c)}
.chip em{font-style:normal;font-size:11px;color:var(--tx3)}
.chip.on{color:var(--c);background:var(--bgc);border-color:var(--c);font-weight:600;box-shadow:none}
.chip.on em{color:var(--c);opacity:.72}
.chip:not(.on){opacity:.5}
.chip:not(.on):hover{opacity:.85}
.mnav{display:flex;gap:4px}
.mnav a{font-size:12.5px;color:var(--tx2);text-decoration:none;padding:6px 12px;border-radius:9px;transition:.18s;white-space:nowrap}
.mnav a:hover{background:rgba(22,38,64,.07);color:var(--tx)}

/* ---------- CALENDAR ---------- */
.month{margin-top:46px}
.mhead{display:flex;align-items:flex-end;gap:14px;margin-bottom:14px}
.mhead .big{font-size:44px;font-weight:800;line-height:.95;letter-spacing:-.03em}
.mhead .big small{font-size:16px;font-weight:600;color:var(--tx2);margin-left:2px;letter-spacing:0}
.mhead .name{font-size:14px;color:var(--tx2);padding-bottom:5px}
.mhead .cnt{margin-left:auto;font-size:12.5px;color:var(--tx3);padding-bottom:6px;letter-spacing:.05em}
.cal{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--sh)}
.wdrow{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:10px}
.wdrow div{text-align:center;font-size:12px;color:var(--tx3);letter-spacing:.14em}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.cell{min-height:104px;border-radius:12px;padding:9px 10px;background:#fbfcfe;
  border:1px solid var(--line2);display:flex;flex-direction:column;gap:6px;position:relative;
  transition:transform .16s,box-shadow .16s,background .16s}
.cell.empty{background:transparent;border-color:transparent}
.cell.has{cursor:pointer;background:#fff;border-color:var(--line);box-shadow:var(--shs)}
.cell.has:hover{transform:translateY(-3px);box-shadow:0 12px 26px rgba(23,43,77,.15);background:#fff}
.cell.has::before{content:'';position:absolute;left:9px;right:9px;top:0;height:2.5px;border-radius:2px;z-index:2;
  background:linear-gradient(90deg,var(--c),rgba(255,255,255,0));opacity:.9}
.cell.today{box-shadow:inset 0 0 0 1.5px rgba(74,122,224,.55)}
.cell.today::after{content:'今天';position:absolute;right:8px;bottom:6px;font-size:9.5px;color:#7c8db0;letter-spacing:.1em}
.ct{display:flex;align-items:baseline;justify-content:space-between;gap:6px}
.cd{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;color:#63748f}
.cell.has .cd{color:var(--tx)}
.cl{font-size:10.5px;color:var(--tx3);white-space:nowrap}
.ev{font-size:11px;line-height:1.32;padding:3px 7px;border-radius:7px;border-left:2.5px solid var(--c);
  background:var(--bgc);color:var(--c);font-weight:500;display:flex;align-items:center;gap:4px;transition:.2s}
.ev .s{font-size:9px;opacity:.95}
.t-chong{--c:var(--chong);--bgc:rgba(191,115,24,.115)}
.t-he{--c:var(--he);--bgc:rgba(20,117,184,.10)}
.t-liu{--c:var(--liu);--bgc:rgba(204,53,115,.105)}
.t-yue{--c:var(--yue);--bgc:rgba(150,116,0,.115)}
.t-ju{--c:var(--ju);--bgc:rgba(13,138,86,.105)}
.ev.dim{opacity:.16;filter:grayscale(1)}

/* ---------- TIMELINE ---------- */
.sec-title{display:flex;align-items:center;gap:12px;margin:64px 0 8px}
.sec-title h2{font-size:22px;font-weight:700;letter-spacing:-.01em}
.sec-title .ln{flex:1;height:1px;background:var(--line)}
.tlgroup{margin-top:32px}
.tlghead{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.tlghead b{font-size:16px}
.tlghead span{font-size:12.5px;color:var(--tx3)}
.tlghead .ln{flex:1;height:1px;background:var(--line)}
.tlitem{display:flex;gap:0}
.tldate{width:74px;flex:none;text-align:right;padding:13px 0 0}
.tldate b{display:block;font-size:14px;font-variant-numeric:tabular-nums;color:#2b3d5c}
.tldate span{display:block;font-size:11.5px;color:var(--tx3)}
.tlrail{width:2px;flex:none;background:rgba(22,38,64,.11);position:relative;margin:0 16px}
.tlrail i{position:absolute;left:-5px;top:18px;width:12px;height:12px;border-radius:50%;background:var(--c);
  box-shadow:0 0 0 3.5px #f0f4fa}
.tlbody{flex:1;padding-bottom:14px;min-width:0}
.tlcard{padding:13px 18px;border-radius:14px;background:#fff;border:1px solid var(--line);
  border-left:3px solid var(--c);box-shadow:var(--shs);cursor:pointer;transition:.18s}
.tlcard:hover{box-shadow:0 10px 22px rgba(23,43,77,.13);transform:translateX(3px)}
.tltop{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.tltop b{font-size:15px}
.tag{font-size:11px;padding:2px 8px;border-radius:6px;background:var(--bgc);color:var(--c);font-weight:600}
.starflag{font-size:10.5px;color:#966e00;border:1px solid rgba(150,110,0,.28);background:rgba(255,206,84,.16);border-radius:6px;padding:1px 7px}
.hardflag{font-size:10.5px;color:#78869c;border:1px solid rgba(22,38,64,.14);background:rgba(22,38,64,.03);border-radius:6px;padding:1px 7px}
.tlmeta{margin-top:6px;font-size:12.5px;color:var(--tx2);display:flex;gap:16px;flex-wrap:wrap}
.tlmeta em{font-style:normal;color:var(--tx3)}

/* ---------- MODAL ---------- */
.modal{position:fixed;inset:0;background:rgba(27,41,66,.32);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;padding:20px;z-index:120;opacity:0;pointer-events:none;transition:.2s}
.modal.show{opacity:1;pointer-events:auto}
.mcard{position:relative;width:min(540px,100%);max-height:86vh;overflow:auto;background:#fff;
  border:1px solid rgba(22,38,64,.1);border-radius:20px;padding:26px 28px;
  box-shadow:0 26px 64px rgba(23,43,77,.26);transform:translateY(12px) scale(.98);transition:.24s cubic-bezier(.2,.8,.3,1)}
.modal.show .mcard{transform:none}
.mtop{display:flex;align-items:center;gap:10px;padding-right:34px}
.mtop h3{font-size:21px;font-weight:700;letter-spacing:-.01em}
.mx{position:absolute;top:22px;right:24px;width:30px;height:30px;border-radius:9px;border:1px solid var(--line);
  background:#f5f8fc;color:var(--tx2);cursor:pointer;font-size:14px;line-height:1;transition:.18s;font-family:inherit}
.mx:hover{background:#e9eef7;color:var(--tx)}
.mdate{margin-top:6px;font-size:13px;color:var(--tx3);letter-spacing:.03em}
.mgrid{margin-top:20px;display:grid;grid-template-columns:auto 1fr;gap:11px 18px;font-size:13.5px;
  border-top:1px solid var(--line);padding-top:18px}
.mgrid dt{color:var(--tx3);font-size:12.5px;letter-spacing:.05em}
.mgrid dd{color:#1a2b46;font-weight:500}
.mfoot{margin-top:20px;padding-top:14px;border-top:1px solid var(--line);font-size:12px;color:var(--tx3)}
.mnav2{margin-top:20px;display:flex;gap:8px}
.mnav2 button{flex:1;padding:9px;border-radius:10px;border:1px solid var(--line);background:#f6f9fd;
  color:var(--tx2);font-size:13px;cursor:pointer;transition:.18s;font-family:inherit}
.mnav2 button:hover{background:#eaf0f9;color:var(--tx)}
footer{margin-top:70px;padding:26px 0 10px;border-top:1px solid var(--line);font-size:12.5px;color:var(--tx3);
  display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}

@media(max-width:900px){
  .wrap{padding:0 16px}
  .cal{padding:12px}
  .grid,.wdrow{gap:6px}
  .cell{min-height:82px;padding:7px 8px;border-radius:10px}
  .cd{font-size:13.5px}.cl{display:none}
  .ev{font-size:10px;padding:2px 5px;border-left-width:2px}
  .mhead .big{font-size:34px}
  .tldate{width:56px}
  .tlrail{margin:0 11px}
  .stats .st{flex:1 1 116px;min-width:110px;padding:13px 14px}
  .st b{font-size:23px}
}
</style>
</head>

const WD = ['日','一','二','三','四','五','六'];
const TYPES = [
  {k:'冲',    cls:'chong'},
  {k:'合',    cls:'he'},
  {k:'流星雨', cls:'liu'},
  {k:'月相',  cls:'yue'},
  {k:'大距',  cls:'ju'}
];

/* 背景装饰点 */
(function(){
  let s='';
  for(let i=0;i<120;i++){
    const sz=(Math.random()*1.6+0.6).toFixed(2);
    s+='<i style="left:'+(Math.random()*100).toFixed(2)+'%;top:'+(Math.random()*100).toFixed(2)+
       '%;width:'+sz+'px;height:'+sz+'px;animation-delay:'+(Math.random()*5).toFixed(2)+
       's;animation-duration:'+(3.4+Math.random()*3).toFixed(2)+'s"></i>';
  }
  document.getElementById('stars').innerHTML=s;
})();

const pad=n=>String(n).padStart(2,'0');
function todayISO(){const t=new Date();return t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(t.getDate());}
const TODAY = todayISO();

const byDate={};
DATA.forEach((e,i)=>{(byDate[e.date]=byDate[e.date]||[]).push(Object.assign({_i:i},e));});

/* ---- HERO ---- */
(function(){
  document.getElementById('s-total-inline').textContent = DATA.length;
  const vis = DATA.filter(e=>e.visible.indexOf('是')===0).length;
  const liu = DATA.filter(e=>e.type==='流星雨').length;
  const chong = DATA.filter(e=>e.name.indexOf('冲')>=0).length;
  const star = DATA.filter(e=>e.star).length;
  const cards=[
    [DATA.length,'项重要天象','#2f57a4'],
    [vis,'项可观测','#0d8a56'],
    [liu,'场流星雨','#cc3573'],
    [chong,'次行星冲日','#bf7318'],
    [star,'项强烈推荐','#967400']
  ];
  document.getElementById('stats').innerHTML = cards.map(c=>
    '<div class="st"><b style="color:'+c[2]+'">'+c[0]+'</b><span>'+c[1]+'</span></div>').join('');

  const up = DATA.find(e=>e.date>=TODAY);
  if(up){
    const d0=new Date(TODAY+'T00:00:00'), d1=new Date(up.date+'T00:00:00');
    const diff=Math.round((d1-d0)/86400000);
    const el=document.getElementById('next');
    el.style.display='flex';
    el.innerHTML='<span class="k">下一场</span><b>'+up.m+'月'+up.d+'日 · '+up.name+'</b>'+
      '<span class="d">'+(diff===0?'就在今天':diff+' 天后')+' · '+up.best+' · '+up.way+'</span>';
  }
})();

/* ---- CHIPS ---- */
let active = new Set(TYPES.map(t=>t.k));
(function(){
  document.getElementById('chips').innerHTML = TYPES.map(t=>{
    const n = DATA.filter(e=>e.type===t.k).length;
    return '<div class="chip on t-'+t.cls+'" data-type="'+t.k+'">'+
      '<i></i>'+t.k+'<em>'+n+'</em></div>';
  }).join('');
  document.querySelectorAll('.chip').forEach(c=>{
    c.onclick=()=>{
      const t=c.dataset.type;
      if(active.has(t)){ active.delete(t); c.classList.remove('on'); }
      else { active.add(t); c.classList.add('on'); }
      applyFilter();
    };
  });
})();

function applyFilter(){
  document.querySelectorAll('.ev').forEach(el=>{
    const on = active.has(el.dataset.type);
    el.classList.toggle('dim', !on);
    el.parentElement.classList.toggle('has', on && el.parentElement.dataset.has==='1');
  });
}

/* ---- MONTH NAV ---- */
const MONTHS=[[2026,10],[2026,11],[2026,12]];
(function(){
  document.getElementById('mnav').innerHTML = MONTHS.map(m=>
    '<a href="#m'+m[0]+'-'+m[1]+'">'+(m[1])+' 月</a>').join('');
})();

/* ---- CALENDARS ---- */
(function(){
  let out='';
  MONTHS.forEach(function(mm){
    const y=mm[0], m=mm[1];
    const start=new Date(y,m-1,1).getDay();
    const days=new Date(y,m,0).getDate();
    const monthEvents = DATA.filter(e=>e.y===y&&e.m===m);
    const maxPerDay = Math.max.apply(null,[1].concat(monthEvents.map(e=>byDate[e.date].length)));

    let cells='';
    for(let i=0;i<start;i++) cells+='<div class="cell empty"></div>';
    for(let d=1;d<=days;d++){
      const ds=y+'-'+pad(m)+'-'+pad(d);
      const evs=byDate[ds]||[];
      const isToday = ds===TODAY;
      let inner='<div class="ct"><span class="cd">'+d+'</span><span class="cl">'+(evs[0]?evs[0].lunar:'')+'</span></div>';
      evs.forEach(e=>{
        inner+='<div class="ev t-'+e.cls+'" data-type="'+e.type+'">'+(e.star?'<span class="s">\u2605</span>':'')+e.name+'</div>';
      });
      cells+='<div class="cell'+(evs.length?' has t-'+evs[0].cls:'')+(isToday?' today':'')+'"'+
             (evs.length?' data-has="1" data-date="'+ds+'"':'')+
             (maxPerDay>1?' style="min-height:'+(104+(maxPerDay-1)*26)+'px"':'')+'>'+inner+'</div>';
    }
    out+='<section class="month" id="m'+y+'-'+m+'">'+
      '<div class="mhead"><div class="big">'+m+'<small>月</small></div>'+
      '<div class="name">'+y+' 年</div>'+
      '<div class="cnt">本月 '+monthEvents.length+' 项天象</div></div>'+
      '<div class="cal"><div class="wdrow">'+WD.map(w=>'<div>'+w+'</div>').join('')+'</div>'+
      '<div class="grid">'+cells+'</div></div></section>';
  });
  document.getElementById('calendars').innerHTML=out;

  document.querySelectorAll('.cell.has').forEach(c=>{
    c.onclick=()=>openModal(c.dataset.date);
  });
})();

/* ---- TIMELINE ---- */
(function(){
  let out='';
  MONTHS.forEach(function(mm){
    const y=mm[0], m=mm[1];
    const list = DATA.filter(e=>e.y===y&&e.m===m);
    if(!list.length) return;
    out+='<div class="tlgroup"><div class="tlghead"><b>'+y+' 年 '+m+' 月</b>'+
         '<span>'+list.length+' 项</span><div class="ln"></div></div>';
    list.forEach(e=>{
      out+='<div class="tlitem t-'+e.cls+'">'+
        '<div class="tldate"><b>'+pad(e.m)+'/'+pad(e.d)+'</b><span>周'+e.wdCn+'</span></div>'+
        '<div class="tlrail"><i></i></div>'+
        '<div class="tlbody"><div class="tlcard" data-date="'+e.date+'">'+
          '<div class="tltop"><span class="tag">'+e.type+'</span><b>'+e.name+'</b>'+
            (e.star?'<span class="starflag">\u5f3a\u63a8</span>':'')+
            (e.hard?'<span class="hardflag">\u8f83\u96be</span>':'')+
          '</div>'+
          '<div class="tlmeta"><span>'+e.best+'</span><em>'+e.way+'</em><em>阴历'+e.lunar+'</em></div>'+
        '</div></div></div>';
    });
    out+='</div>';
  });
  document.getElementById('timeline').innerHTML=out;
  document.querySelectorAll('.tlcard').forEach(c=>{
    c.onclick=()=>openModal(c.dataset.date);
  });
})();

/* ---- MODAL ---- */
const modal=document.getElementById('modal'), mcard=document.getElementById('mcard');
function openModal(ds){
  const evs=byDate[ds]||[]; if(!evs.length) return;
  let h='<button class="mx" onclick="closeModal()">\u2715</button>';
  evs.forEach(function(e,k){
    h+='<div class="mtop"'+(k?' style="margin-top:26px;border-top:1px solid rgba(22,38,64,.09);padding-top:20px"':'')+'>'+
        '<span class="tag t-'+e.cls+'">'+e.type+'</span><h3>'+e.name+'</h3>'+
        (e.star?'<span class="starflag">\u5f3a\u63a8</span>':'')+'</div>'+
      '<div class="mdate">'+e.y+' 年 '+e.m+' 月 '+e.d+' 日 · 星期'+e.wdCn+' · 阴历'+e.lunar+'</div>'+
      '<dl class="mgrid">'+
        '<dt>是否可见</dt><dd>'+e.visible+'</dd>'+
        '<dt>最佳时段</dt><dd>'+e.best+'</dd>'+
        '<dt>观测方式</dt><dd>'+e.way+'</dd>'+
        (e.note?'<dt>备注</dt><dd>'+e.note+'</dd>':'')+
      '</dl>';
    if(k===0) h+='<div class="mfoot">表格序号 '+e.no+' / '+DATA.length+'</div>';
  });
  const i0=DATA.indexOf(DATA.find(x=>x.date===ds));
  h+='<div style="margin-top:18px"><div class="mnav2">'+
     '<button onclick="step('+i0+',-1)">\u2190 上一场</button>'+
     '<button onclick="step('+i0+',1)">下一场 \u2192</button></div></div>';
  mcard.innerHTML=h;
  modal.classList.add('show');
  document.body.classList.add('lock');
}
function step(i,dir){
  const n=i+dir;
  if(n<0||n>=DATA.length) return;
  openModal(DATA[n].date);
}
function closeModal(){
  modal.classList.remove('show');
  document.body.classList.remove('lock');
}
modal.addEventListener('click',e=>{ if(e.target===modal) closeModal(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });
applyFilter();
</script>
</body>
</html>
